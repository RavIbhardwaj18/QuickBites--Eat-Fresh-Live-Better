<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUICKBITES-Online Food Delivery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f9f9f9;
            transition: background 0.5s, color 0.4s;
        }
        header {
            background: #ff5733;
            padding: 15px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 20px;
            padding-right: 20px;
        }
        .nav-icons span {
            font-size: 24px;
            margin: 0 10px;
            cursor: pointer;
        }
        .welcome h2 {
            font-size: 28px;
            margin-top: 20px;
        }
        .search-bar {
            margin: 20px;
        }
        .search-bar input {
            padding: 10px;
            width: 50%;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .search-bar button {
            padding: 10px;
            background: #ff5733;
            color: white;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .search-bar button:hover {
            background: #1a0904;
        }
        .login-options {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }
        .login-box {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 12px;
            background: white;
            width: 200px;
            text-align: center;
        }
        .login-box h3 {
            margin-bottom: 10px;
        }
        .login-box button {
            display: block;
            margin: 5px auto;
            padding: 10px;
            background: #ff5733;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            width: 80%;
        }
        .login-box button:hover {
            background: #d84315;
        }
        .food-categories {
            margin: 30px;
        }
        .food-categories button {
            padding: 10px 20px;
            margin: 6px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            background: #ffbd69;
        }
        .food-categories button:hover {
            background: #ff9f33;
        }
        .dark-mode {
            background-color: #222;
            color: white;
        }
        footer {
            background: #333;
            color: white;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <h1>QUICKBITES</h1>
        <div class="nav-icons">
            <span onclick="goHome()">🏠</span>
            <span onclick="openAccount()">👤</span>
            <span onclick="openSettings()">⚙</span>
            <span onclick="toggleDarkMode()">🌙</span>
        </div>
    </header>
    <!-- Welcome Heading -->
    <section class="welcome">
        <h2>Welcome to QUICKBITES</h2>
    </section>
    <!-- Search Bar -->
    <section class="search-bar">
        <input type="text" id="search" placeholder="Explore Your Craving...">
        <button onclick="searchFood()">🔍</button>
    </section>

    <!-- Login Options -->
    <section class="login-options">
        <div class="login-box">
            <h3>Login as Restaurant</h3>
            <button onclick="restaurantLogin()">Login</button>
            <button onclick="restaurantSignup()">Signup</button>
        </div>
        <div class="login-box">
            <h3>Login as Customer</h3>
            <button onclick="customerLogin()">Login</button>
            <button onclick="customerSignup()">Signup</button>
        </div>
    </section>

    <!-- Food Categories -->
    <section class="food-categories">
        <button onclick="showFood('Indian')">🍛 Indian</button>
        <button onclick="showFood('Chinese')">🥡 Chinese</button>
        <button onclick="showFood('Italian')">🍕 Italian</button>
        <button onclick="showFood('Thai')">🍜 Thai</button>
        <button onclick="showFood('Other')">🍽 Other</button>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 QUICKBYTES. All rights reserved.</p>
    </footer>

    <script>
        // Dark Mode Toggle
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }

        function goHome() {
            alert("Navigating to Home...");
        }
        function openAccount() {
            alert("Opening Account Settings...");
        }
        function openSettings() {
            alert("Opening Settings...");
        }
        function searchFood() {
            let query = document.getElementById("search").value;
            alert("Searching for: " + query);
        }

        function restaurantLogin() {
            alert("Redirecting to Restaurant Login...");
        }

        function restaurantSignup() {
            alert("Redirecting to Restaurant Signup...");
        }

        function customerLogin() {
            alert("Redirecting to Customer Login...");
        }

        function customerSignup() {
            alert("Redirecting to Customer Signup...");
        }

        // Food Categories
        function showFood(category) {
            alert("Showing " + category + " food options...");
        }
    </script>
</body>
</html>
